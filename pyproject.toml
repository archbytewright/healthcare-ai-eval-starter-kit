[project]
name = "healthcare-ai-eval-starter-kit"
version = "0.1.0"
description = "A vendor-neutral framework and worked-example harness for resource-constrained health systems to do due-diligence, local evaluation, and minimal governance of a clinical AI tool. Synthetic data only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "archbytewright", email = "293463993+archbytewright@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
hai-eval = "hai_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_eval"]

[dependency-groups]
dev = [
    "hypothesis>=6.161.5",
    "mypy>=1.20.0",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "TCH", "PTH",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# Type-checking-import placement (a runtime-cost optimization) is noise in tests.
"tests/**" = ["TC001", "TC002", "TC003"]
# The fold tests contain look-alike characters ON PURPOSE -- a zero-width space, a soft hyphen and
# eight Unicode dashes are the inputs under test. Flagging them as "ambiguous" is the linter doing
# its job on a file whose subject is exactly that ambiguity.
"tests/test_textfold.py" = ["TC001", "TC002", "TC003", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/hai_eval"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
